<div class="form-card" id="form">
      <h3>השאירו פרטים</h3>
      <p class="sub">אחזור אליכם בהקדם, בדרך שנוחה לכם, לתיאום שיחת היכרות קצרה.</p>
      <form id="leadForm" class="lead-form" method="post" action="/api/lead" novalidate>
        <input type="hidden" name="type" value="lead">
        <input type="hidden" name="page" value="">
        <p class="hp" aria-hidden="true"><label>אל תמלאו שדה זה <input type="text" name="website" tabindex="-1" autocomplete="off"></label></p>
        <div class="field">
          <label for="f-name">שם מלא <i>*</i></label>
          <input id="f-name" name="name" type="text" autocomplete="name" required minlength="2" placeholder="איך לפנות אליך?">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-phone">טלפון <i>*</i></label>
            <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required minlength="7" dir="ltr" placeholder="050-000-0000">
          </div>
          <div class="field">
            <label for="f-email">אימייל</label>
            <input id="f-email" name="email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-contact">איך נוח שאחזור?</label>
            <select id="f-contact" name="preferred_contact">
              <option value="וואטסאפ">וואטסאפ</option>
              <option value="טלפון">שיחת טלפון</option>
              <option value="אימייל">אימייל</option>
            </select>
          </div>
          <div class="field">
            <label for="f-service">במה מדובר?</label>
            <select id="f-service" name="service">
              <option value="">עדיין לא בטוח/ה</option>
              <option value="טיפול אישי">טיפול אישי</option>
              <option value="טיפול זוגי">טיפול זוגי</option>
              <option value="טיפול משפחתי">טיפול משפחתי</option>
              <option value="הדרכת הורים">הדרכת הורים</option>
              <option value="ליווי רילוקיישן">ליווי רילוקיישן</option>
              <option value="ריטריט זוגיות">ריטריט זוגיות</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-msg">כמה מילים (לא חובה)</label>
          <textarea id="f-msg" name="message" maxlength="2000" placeholder="מה מביא אתכם? איפה אתם בעולם? מתי נוח לדבר?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <span class="btn-label">שליחה</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
        <p class="form-note">הפרטים נשלחים ישירות למיכל ואינם משותפים עם אף גורם אחר. <a href="/privacy">מדיניות פרטיות</a></p>
        <p class="form-error" role="alert" hidden></p>
      </form>
      <div class="form-success" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
        <h3>תודה, הפרטים התקבלו</h3>
        <p>אחזור אליכם בהקדם בשעות הפעילות (א׳–ו׳, שעון ישראל). אם דחוף לכם, אפשר גם לכתוב לי עכשיו בוואטסאפ.</p>
        <a href="https://wa.me/972506264382" target="_blank" rel="noopener" class="btn btn-whatsapp">וואטסאפ</a>
      </div>
    </div>
